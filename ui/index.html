<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metabase Desktop</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #0f172a; color: #e2e8f0;
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card { text-align: center; padding: 24px; width: 100%; }
    .logo { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .tagline { font-size: 11px; color: #64748b; line-height: 1.55; margin-bottom: 12px; }
    #status { font-size: 12.5px; color: #94a3b8; min-height: 18px; }
    .bar {
      width: 220px; height: 4px; background: #1e293b;
      border-radius: 99px; margin: 16px auto 0; overflow: hidden;
    }
    .bar-fill {
      width: 100%; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, transparent, #34d399, transparent);
      transform: translateX(-100%);
      animation: slide 1.4s linear infinite;
    }
    @keyframes slide { to { transform: translateX(100%); } }
    .error { margin-top: 14px; }
    #error-msg {
      font-size: 12px; color: #f87171; max-width: 380px;
      margin: 0 auto 10px; white-space: pre-wrap;
    }
    button {
      background: #34d399; border: none; color: #052e1b; font-weight: 600;
      font-size: 12.5px; padding: 7px 18px; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #6ee7b7; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🗃️</div>
    <h1>Metabase Desktop</h1>
    <p class="tagline">No setup quests. No environment puzzles.<br/>Everything's in the box — just open it and ask your data things.</p>
    <p id="status">Starting Metabase… usually takes 15–40s.</p>
    <div class="bar" id="bar"><div class="bar-fill"></div></div>
    <div class="error hidden" id="error">
      <p id="error-msg"></p>
      <button id="retry">Coba Lagi</button>
    </div>
  </div>
  <script>
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('bar');
    const barFill = bar.querySelector('.bar-fill');
    const errorBox = document.getElementById('error');
    const errorMsg = document.getElementById('error-msg');

    const setIndeterminate = () => {
      barFill.style.animation = '';
      barFill.style.width = '';
      barFill.style.transform = '';
      barFill.style.background = '';
    };

    listen('backend-status', (e) => {
      statusEl.textContent = e.payload;
      bar.classList.remove('hidden');
      setIndeterminate();
    });
    listen('update-status', (e) => { statusEl.textContent = e.payload; });
    listen('update-progress', (e) => {
      const { received, total } = e.payload;
      barFill.style.animation = 'none';
      barFill.style.transform = 'none';
      barFill.style.background = '#34d399';
      if (total) {
        const p = Math.min(100, (received / total) * 100);
        barFill.style.width = p + '%';
        statusEl.textContent = `Downloading metabase.jar… ${p.toFixed(0)}% (${(received / 1048576).toFixed(0)}/${(total / 1048576).toFixed(0)} MB)`;
      } else {
        statusEl.textContent = `Downloading metabase.jar… ${(received / 1048576).toFixed(0)} MB`;
      }
    });
    listen('backend-error', (e) => {
      statusEl.textContent = 'Failed to start Metabase.';
      errorMsg.textContent = e.payload;
      bar.classList.add('hidden');
      errorBox.classList.remove('hidden');
    });
    listen('backend-ready', () => {
      statusEl.textContent = 'Ready! Opening window…';
      bar.classList.add('hidden');
    });

    document.getElementById('retry').addEventListener('click', () => {
      errorBox.classList.add('hidden');
      statusEl.textContent = 'Restarting Metabase…';
      bar.classList.remove('hidden');
      invoke('retry_backend');
    });
  </script>
</body>
</html>
