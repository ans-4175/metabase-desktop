<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Metabase</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #0f172a; color: #e2e8f0;
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card { text-align: center; width: 100%; padding: 20px; }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    #status { font-size: 12px; color: #94a3b8; min-height: 16px; margin-bottom: 12px; }
    .bar {
      width: 300px; height: 6px; background: #1e293b;
      border-radius: 99px; margin: 0 auto; overflow: hidden;
    }
    #fill {
      width: 0%; height: 100%; background: #34d399;
      border-radius: 99px; transition: width 0.25s ease;
    }
    #pct { font-size: 11px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Metabase Update</h1>
    <p id="status">Connecting…</p>
    <div class="bar"><div id="fill"></div></div>
    <p id="pct"></p>
  </div>
  <script>
    const { listen } = window.__TAURI__.event;
    const statusEl = document.getElementById('status');
    const fill = document.getElementById('fill');
    const pct = document.getElementById('pct');

    listen('update-status', (e) => { statusEl.textContent = e.payload; });
    listen('update-progress', (e) => {
      const { received, total } = e.payload;
      if (total) {
        const p = Math.min(100, Math.round((received / total) * 100));
        fill.style.width = p + '%';
        pct.textContent = `${p}% (${(received / 1048576).toFixed(0)} / ${(total / 1048576).toFixed(0)} MB)`;
      } else {
        pct.textContent = `${(received / 1048576).toFixed(0)} MB`;
      }
    });
  </script>
</body>
</html>
